name: nusapay
description: NusaPay — Flutter e-wallet app with ValidQR anti-fraud QRIS scanning. HackNusa 2026.
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # QR code scanning
  mobile_scanner: ^5.1.1

  # HTTP client for ValidQR API
  http: ^1.2.0

  # GPS / location
  geolocator: ^12.0.0

  # State management
  provider: ^6.1.2

  # UI enhancements
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  # fonts:
